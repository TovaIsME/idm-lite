name: release

# Tag a version and this builds it on each platform and attaches the results
# to the release. Nothing cross-compiles: the Windows installer is built by
# Windows, the .app by macOS, the .deb by Linux.
#
#   git tag v1.0.4 && git push origin v1.0.4

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and upload to"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # One job makes the release, so three packaging jobs cannot race to create it.
  open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release if it is not there yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --title "IDM-lite ${tag#v}" --generate-notes

  package:
    needs: open
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Test before shipping
        run: cargo test --release

      - name: Package
        run: python tools/package.py

      # The version in the file names comes from Cargo.toml, so the tag has to
      # agree with it or people end up downloading something else.
      - name: The tag matches Cargo.toml
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "v$version" ]; then
            echo "tag $tag does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Checksums
        shell: bash
        working-directory: dist
        run: |
          shopt -s nullglob
          files=(*.exe *.zip *.dmg *.tar.gz *.deb)
          # one checksum file per platform, merged into the release below
          sha256sum "${files[@]}" > "SHA256SUMS-$RUNNER_OS.txt"
          cat "SHA256SUMS-$RUNNER_OS.txt"

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          cd dist
          shopt -s nullglob
          # the staged folders are not artifacts; only the finished files are
          gh release upload "$tag" *.exe *.zip *.dmg *.tar.gz *.deb SHA256SUMS-*.txt --clobber
