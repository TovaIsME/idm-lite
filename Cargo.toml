[package]
name = "idm-lite"
version = "1.0.2"
edition = "2021"
description = "Segmented download manager with browser capture"

[[bin]]
name = "IDM-lite"
path = "src/main.rs"

[[bin]]
name = "update"
path = "src/bin/update.rs"

[dependencies]
ureq = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.56"
getrandom = "0.4"
wry = "0.57.1"
tao = "0.37.2"
rfd = "0.17.2"
tray-icon = "0.26.1"

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

